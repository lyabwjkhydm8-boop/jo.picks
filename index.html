<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jo Picks - Smart Affiliate</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Tajawal',sans-serif;background:#FAF6F0;color:#2b2b2b}.hero{padding:24px;background:linear-gradient(135deg,#0F5E5A,#1A7A75);color:white;text-align:center}.logo{font-size:38px;font-weight:800;color:#F9E6A0}.code-badge{margin:12px auto;background:rgba(255,255,255,.15);padding:10px 18px;border-radius:30px;display:inline-flex;gap:8px;align-items:center}.wrap{max-width:1100px;margin:0 auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#FAF6F0;z-index:5}.tab{white-space:nowrap;padding:9px 16px;border-radius:30px;background:white;border:1px solid #EDE5D8;cursor:pointer;font-weight:700;font-size:13px}.tab.active{background:#0F5E5A;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:768px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.07);border:1px solid #EDE5D8}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:10px}.price{color:#0F5E5A;font-weight:800;font-size:14px}.buy{margin-top:6px;background:#0F5E5A;color:white;text-align:center;padding:9px;border-radius:9px;text-decoration:none;font-weight:800;display:block;font-size:13px}.del{background:#ffe9e9;color:#c0392b;text-align:center;padding:7px;border-radius:9px;cursor:pointer;font-size:11px;margin-top:5px;display:none}.admin .del{display:block}.adminFab{position:fixed;bottom:16px;left:16px;background:#2b2b2b;color:#F5EFE6;padding:13px 18px;border-radius:30px;cursor:pointer;z-index:50;font-weight:800;font-size:13px}.adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;overflow:auto;padding:14px}.adminBox{max-width:560px;margin:10px auto;background:#1F1F1F;color:#F5EFE6;border-radius:16px;padding:16px;border:1px solid #333}.adminBox input,.adminBox select{width:100%;padding:11px;border-radius:9px;margin:5px 0;background:#2b2b2b;color:white;border:1px solid #444;font-size:13px}.adminBox button{width:100%;padding:11px;border-radius:11px;border:0;font-weight:800;margin-top:6px;cursor:pointer}.btnTeal{background:#0F5E5A;color:white}.btnGold{background:#D4AF37;color:#2b2b2b}.smartBox{background:#0F2E2C;border:1px dashed #1A7A75;padding:12px;border-radius:12px;margin:10px 0}.smartBox h4{color:#F9E6A0;font-size:13px;margin-bottom:8px}.small{font-size:11px;color:#888;margin:4px 0}</style></head><body><div class="hero"><div class="logo">Jo Picks</div><div style="font-size:13px;opacity:.9">بيجامات تركية فاخرة</div><div class="code-badge"><span>كود:</span><b id="mainCode">J4YECUK</b><button onclick="copyCode()" style="background:rgba(255,255,255,.2);border:0;color:white;padding:5px 10px;border-radius:20px;cursor:pointer;font-size:11px">نسخ</button></div></div><div class="wrap"><div class="tabs"><div class="tab active" data-cat="all" onclick="filterCat('all')">الكل ✨</div><div class="tab" data-cat="pajamas" onclick="filterCat('pajamas')">بيجامات</div><div class="tab" data-cat="clothes" onclick="filterCat('clothes')">ملابس</div><div class="tab" data-cat="bags" onclick="filterCat('bags')">شنط</div><div class="tab" data-cat="beauty" onclick="filterCat('beauty')">جمال</div><div class="tab" data-cat="lingerie" onclick="filterCat('lingerie')">لانجري</div></div><div id="sections"></div></div><div class="adminFab" onclick="openAdmin()">👑 أدمن - إضافة ذكية</div><div class="adminPanel" id="adminPanel"><div class="adminBox"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px">إضافة منتج ذكية 🧠</h3><button onclick="closeAdmin()" style="width:auto;background:#333;color:white;padding:5px 10px;border-radius:20px">✕</button></div><div class="smartBox"><h4>🚀 الطريقة الذكية الجديدة:</h4><label>1️⃣ الصقي رابط المنتج من شي إن (أفلييت أو عادي)</label><input id="smart_link" placeholder="https://www.shein.com/... أو رابط الأفلييت"><button class="btnGold" onclick="smartFetch()" style="margin-top:6px">🔍 جلب المنتج تلقائياً</button><div class="small" id="fetchStatus"></div></div><label>القسم (انتي تحدديه)</label><select id="p_cat"><option value="pajamas">بيجامات تركية</option><option value="clothes">ملابس</option><option value="bags">شنط</option><option value="beauty">جمال</option><option value="lingerie">لانجري</option></select><label>اسم المنتج (ينزل تلقائي)</label><input id="p_name" placeholder="بيجاما ساتان"><label>السعر بالدولار (ينزل تلقائي) - سيتحول للأردني</label><input id="p_price_usd" placeholder="18.5" type="number" oninput="convertPrice()"><label>السعر بالأردني (تلقائي)</label><input id="p_price" placeholder="13 د.أ"><label>رابط الصورة (ينزل تلقائي)</label><input id="p_img" placeholder="https://..."><label>رابط الأفلييت النهائي (رابطك انتي)</label><input id="p_link" placeholder="https://onelink.shein.com/..."><div style="display:flex;gap:8px"><button class="btnTeal" onclick="addProduct()" style="flex:2">إضافة المنتج ✅</button><button onclick="clearForm()" style="flex:1;background:#333;color:white">مسح</button></div><hr style="border-color:#333;margin:14px 0"><label>الإعدادات العامة</label><input id="a_code" value="J4YECUK" placeholder="كود الخصم"><input id="a_link" value="https://onelink.shein.com/58/66aaihsqsavt?ismg_ol=21gvunjldxU_01_KOC-C" placeholder="رابط الأفلييت العام"><button class="btnGold" onclick="saveSettings()">حفظ الإعدادات 💾</button><div class="small" style="margin-top:12px">المنتجات: <span id="count">0</span> | السر: Jo123 | <span style="color:#F9E6A0">منتجاتك القديمة محفوظة ✅</span></div></div></div><script>const LS='jopicks_fixed_v2';let currentFilter='all';let store=JSON.parse(localStorage.getItem(LS)||'null')||{code:'J4YECUK',link:'https://onelink.shein.com/58/66aaihsqsavt?ismg_ol=21gvunjldxU_01_KOC-C',products:[]};function save(){try{localStorage.setItem(LS,JSON.stringify(store));render();}catch(e){alert('التخزين مليان! احذفي منتجات أو استخدمي روابط صور');}}function render(){document.getElementById('mainCode').innerText=store.code;document.getElementById('count').innerText=store.products.length;const c=document.getElementById('sections');c.innerHTML='';const cats=currentFilter==='all'?['pajamas','clothes','bags','beauty','lingerie']:[currentFilter];cats.forEach(cat=>{const list=store.products.filter(p=>p.cat===cat);if(currentFilter!=='all'&&!list.length)return;if(currentFilter==='all'&&!list.length&&cat!=='pajamas'&&store.products.length) return;if(!list.length&&store.products.length===0&&cat!=='pajamas')return;let html=`<div style="margin:16px 6px 8px;font-weight:800;color:#0F5E5A;font-size:15px">${cat} <span style="background:#0F5E5A;color:white;padding:2px 7px;border-radius:20px;font-size:11px">${list.length}</span></div><div class="grid">`;if(list.length===0&&store.products.length===0&&cat==='pajamas'){html=`<div style="text-align:center;padding:30px;background:white;border-radius:14px;color:#888;margin-top:10px">لا يوجد منتجات - أضيفي من الأدمن الذكي 👑<br><small>حطي رابط شي إن وهو بيجيب المنتج لحاله</small></div>`;c.innerHTML+=html;return;}list.forEach(p=>{html+=`<div class=card><img src="${p.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300'"><div class=card-body><div style="font-size:12px;font-weight:700;height:32px;overflow:hidden">${p.name}</div><div class=price>${p.price}</div><a class=buy href="${p.link||store.link}" target=_blank>اطلبه 🛒</a><div class=del onclick="delProduct(${p.id})">حذف المنتج 🗑️</div></div></div>`;});html+='</div>';c.innerHTML+=html;});}function filterCat(cat){currentFilter=cat;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelector(`[data-cat="${cat}"]`).classList.add('active');render();}function openAdmin(){const pw=prompt('كلمة السر:');if(pw==='Jo123'){document.getElementById('adminPanel').style.display='block';document.body.classList.add('admin');document.getElementById('a_code').value=store.code;document.getElementById('a_link').value=store.link;}else if(pw)alert('خطأ');}function closeAdmin(){document.getElementById('adminPanel').style.display='none';document.body.classList.remove('admin');}function saveSettings(){store.code=document.getElementById('a_code').value||'J4YECUK';store.link=document.getElementById('a_link').value;save();alert('تم الحفظ');}function convertPrice(){const usd=parseFloat(document.getElementById('p_price_usd').value);if(!isNaN(usd)){const jod=(usd*0.71).toFixed(2);document.getElementById('p_price').value=jod+' د.أ';}}async function smartFetch(){const link=document.getElementById('smart_link').value.trim();const status=document.getElementById('fetchStatus');if(!link){alert('حطي رابط المنتج أول');return;}status.innerText='⏳ جاري جلب المنتج...';try{let realUrl=link;if(link.includes('onelink.shein')){status.innerText='🔗 رابط أفلييت - جاري فتح الرابط الأصلي... (انسخي رابط المنتج العادي من شي إن لأفضل نتيجة)';}const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(realUrl);const res=await fetch(proxy);const data=await res.json();const html=data.contents;let titleMatch=html.match(/<title>(.*?)<\/title>/i);let title=titleMatch?titleMatch[1].split('|')[0].trim():'منتج شي إن';let imgMatch=html.match(/<meta property="og:image" content="(.*?)"/i);let img=imgMatch?imgMatch[1]:'';let priceMatch=html.match(/\$([\d\.]+)/);let price=priceMatch?priceMatch[1]:'';if(title){document.getElementById('p_name').value=title.substring(0,50);}if(img){document.getElementById('p_img').value=img;}if(price){document.getElementById('p_price_usd').value=price;convertPrice();}document.getElementById('p_link').value=store.link;status.innerText='✅ تم الجلب! عدلي القسم والسعر إذا بدك ثم اضغطي إضافة';}catch(e){status.innerText='⚠️ ما قدرنا نجيب تلقائي - انسخي الاسم والسعر يدوياً من شي إن، والسعر رح يتحول للأردني لحاله';document.getElementById('p_link').value=store.link;}}function addProduct(){const name=document.getElementById('p_name').value||'منتج جديد';const price=document.getElementById('p_price').value||'--';const img=document.getElementById('p_img').value||'https://via.placeholder.com/300';const link=document.getElementById('p_link').value.trim()||store.link;const cat=document.getElementById('p_cat').value;if(!img.includes('http')){alert('حطي رابط صورة صحيح');return;}const p={id:Date.now(),cat,name,price,img,link};store.products.unshift(p);save();clearForm();alert('تمت الإضافة ✅ - شوفيه في المتجر!');}function clearForm(){document.getElementById('smart_link').value='';document.getElementById('p_name').value='';document.getElementById('p_price_usd').value='';document.getElementById('p_price').value='';document.getElementById('p_img').value='';document.getElementById('p_link').value='';document.getElementById('fetchStatus').innerText='';}function delProduct(id){if(confirm('حذف المنتج؟')){store.products=store.products.filter(p=>p.id!==id);save();}}function copyCode(){navigator.clipboard.writeText(store.code);alert('تم نسخ: '+store.code);}render();</script></body></html>
