<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jo Picks</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#FAF6F0;color:#2b2b2b}
.hero{padding:20px;background:linear-gradient(135deg,#0F5E5A,#1A7A75);color:white;text-align:center}
.logo{font-size:36px;font-weight:800;color:#F9E6A0}
.code{background:rgba(255,255,255,.15);display:inline-block;margin-top:8px;padding:8px 16px;border-radius:20px;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#FAF6F0;z-index:5}
.tab{white-space:nowrap;padding:9px 16px;border-radius:30px;background:white;border:1px solid #EDE5D8;cursor:pointer;font-weight:700;font-size:13px}
.tab.active{background:#0F5E5A;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.07);border:1px solid #EDE5D8}
.card img{width:100%;height:210px;object-fit:cover;background:#f3f3f3}
.card-body{padding:10px}
.pname{font-size:12px;font-weight:700;height:32px;overflow:hidden;line-height:1.3}
.price{color:#0F5E5A;font-weight:800;margin-top:4px;font-size:14px}
.buy{margin-top:6px;background:#0F5E5A;color:white;text-align:center;padding:9px;border-radius:9px;text-decoration:none;font-weight:800;display:block;font-size:13px}
.adminFab{position:fixed;bottom:16px;left:16px;background:#2b2b2b;color:#F5EFE6;padding:13px 18px;border-radius:30px;cursor:pointer;z-index:50;font-weight:800;font-size:13px}
.adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;overflow:auto;padding:16px}
.adminBox{max-width:500px;margin:20px auto;background:#1F1F1F;color:#F5EFE6;border-radius:16px;padding:18px;border:1px solid #333}
.adminBox input,.adminBox select{width:100%;padding:12px;border-radius:10px;margin:6px 0;background:#2b2b2b;color:white;border:1px solid #444}
.adminBox button{width:100%;padding:12px;border-radius:10px;border:0;font-weight:800;margin-top:8px;cursor:pointer}
.btnTeal{background:#0F5E5A;color:white}
.btnGold{background:#D4AF37;color:#2b2b2b}
.status{font-size:11px;color:#F9E6A0;margin:6px 0}
.del{color:#ff8a8a;text-align:center;font-size:11px;margin-top:6px;cursor:pointer;display:none}
.admin .del{display:block}
</style>
</head>
<body>
<div class="hero">
<div class="logo">Jo Picks</div>
<div style="font-size:12px;opacity:.9">بيجامات تركية فاخرة</div>
<div class="code">كود الخصم: <b id="mainCode">J4YECUK</b> <button onclick="copyCode()" style="margin-right:8px;background:rgba(255,255,255,.25);border:0;color:white;padding:4px 10px;border-radius:12px;cursor:pointer">نسخ</button></div>
</div>

<div class="wrap">
<div class="tabs">
<div class="tab active" data-cat="all" onclick="filterCat('all')">الكل ✨</div>
<div class="tab" data-cat="pajamas" onclick="filterCat('pajamas')">بيجامات</div>
<div class="tab" data-cat="clothes" onclick="filterCat('clothes')">ملابس</div>
<div class="tab" data-cat="bags" onclick="filterCat('bags')">شنط</div>
<div class="tab" data-cat="beauty" onclick="filterCat('beauty')">جمال</div>
<div class="tab" data-cat="lingerie" onclick="filterCat('lingerie')">لانجري</div>
</div>
<div id="sections"></div>
</div>

<div class="adminFab" onclick="openAdmin()">👑 إضافة منتج</div>

<div class="adminPanel" id="adminPanel">
<div class="adminBox">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>إضافة برابط الأفلييت فقط</h3>
<button onclick="closeAdmin()" style="width:auto;background:#333;color:white;padding:6px 12px;border-radius:20px">✕</button>
</div>

<div style="background:#0F2E2C;border:1px dashed #1A7A75;padding:12px;border-radius:12px;margin:12px 0">
<label style="color:#F9E6A0;font-size:13px">1️⃣ الصقي رابط الأفلييت من شي إن</label>
<input id="aff_link" placeholder="https://onelink.shein.com/... أو رابط المنتج من شي إن">
<label style="margin-top:8px">2️⃣ اختاري الخانة اللي بدك ياها</label>
<select id="p_cat">
<option value="pajamas">بيجامات</option>
<option value="clothes">ملابس</option>
<option value="bags">شنط</option>
<option value="beauty">جمال</option>
<option value="lingerie">لانجري</option>
</select>
<button class="btnGold" onclick="fetchAndAdd()">✨ إضافة في الخانة</button>
<div id="status" class="status"></div>
</div>

<div id="preview" style="display:none;background:#2b2b2b;padding:10px;border-radius:10px;margin:10px 0">
<img id="prev_img" style="width:100%;height:180px;object-fit:cover;border-radius:8px">
<div id="prev_name" style="font-size:12px;margin-top:6px"></div>
<div id="prev_price" style="color:#F9E6A0;font-weight:800"></div>
</div>

<hr style="border-color:#333;margin:14px 0">
<label>كود الخصم العام</label>
<input id="a_code" value="J4YECUK">
<button class="btnTeal" onclick="saveCode()">حفظ الكود 💾</button>
<div style="font-size:11px;color:#666;margin-top:12px">المنتجات: <span id="count">0</span> | السر: Jo123</div>
</div>
</div>

<script>
const LS='jopicks_simple_final';
let currentFilter='all';
let store=JSON.parse(localStorage.getItem(LS)||'null')||{code:'J4YECUK',products:[]};

function save(){localStorage.setItem(LS,JSON.stringify(store));render();}
function render(){
document.getElementById('mainCode').innerText=store.code;
document.getElementById('count').innerText=store.products.length;
const c=document.getElementById('sections');c.innerHTML='';
const cats=currentFilter==='all'?['pajamas','clothes','bags','beauty','lingerie']:[currentFilter];
cats.forEach(cat=>{
const list=store.products.filter(p=>p.cat===cat);
if(currentFilter!=='all' && !list.length) return;
if(!list.length && store.products.length===0 && cat!=='pajamas') return;
let title=cat==='pajamas'?'بيجامات تركية':cat==='clothes'?'ملابس':cat==='bags'?'شنط':cat==='beauty'?'جمال':'لانجري';
let html=`<div style="margin:18px 6px 8px;font-weight:800;color:#0F5E5A;font-size:15px">${title} <span style="background:#0F5E5A;color:white;padding:2px 8px;border-radius:20px;font-size:11px">${list.length}</span></div>`;
if(store.products.length===0 && cat==='pajamas'){
html+=`<div style="text-align:center;padding:30px;background:white;border-radius:14px;color:#888">لا يوجد منتجات بعد<br><small>اضغطي 👑 إضافة منتج وحطي رابط الأفلييت</small></div>`;
c.innerHTML+=html;return;
}
html+=`<div class="grid">`;
list.forEach(p=>{
html+=`<div class=card><img src="${p.img}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500'"><div class=card-body><div class=pname>${p.name}</div><div class=price>${p.price}</div><a class=buy href="${p.link}" target=_blank>اطلبه مع كود ${store.code} 🛒</a><div class=del onclick="delProduct(${p.id})">حذف المنتج 🗑️</div></div></div>`;
});
html+=`</div>`;
c.innerHTML+=html;
});
}
function filterCat(cat){currentFilter=cat;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelector(`[data-cat="${cat}"]`).classList.add('active');render();}
function openAdmin(){const pw=prompt('كلمة السر:');if(pw==='Jo123'){document.getElementById('adminPanel').style.display='block';document.body.classList.add('admin');document.getElementById('a_code').value=store.code;}else if(pw)alert('خطأ');}
function closeAdmin(){document.getElementById('adminPanel').style.display='none';document.body.classList.remove('admin');}
function saveCode(){store.code=document.getElementById('a_code').value||'J4YECUK';save();alert('تم حفظ الكود');}
function copyCode(){navigator.clipboard.writeText(store.code);alert('تم نسخ الكود: '+store.code);}

async function fetchAndAdd(){
const aff=document.getElementById('aff_link').value.trim();
const cat=document.getElementById('p_cat').value;
const status=document.getElementById('status');
if(!aff){alert('حطي رابط الأفلييت');return;}
status.innerText='⏳ جاري جلب معلومات المنتج...';
document.getElementById('preview').style.display='none';
try{
const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(aff);
const res=await fetch(proxy);
const data=await res.json();
const html=data.contents;

let name='منتج شي إن';
let t=html.match(/<title>(.*?)<\/title>/i);
if(t){name=t[1].split('|')[0].split('-')[0].trim().substring(0,60);}

let img='';
let m=html.match(/<meta property="og:image" content="(.*?)"/i);
if(m) img=m[1];
if(!img){
let m2=html.match(/"image":"(.*?)"/);
if(m2) img=m2[1];
}
if(!img) img='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500';

let priceUSD=null;
let pm=html.match(/\$([\d]+\.[\d]+)/);
if(pm) priceUSD=parseFloat(pm[1]);
else{
let pm2=html.match(/"salePrice":"([\d\.]+)"/);
if(pm2) priceUSD=parseFloat(pm2[1]);
}
let priceJOD=priceUSD? (priceUSD*0.71).toFixed(2)+' د.أ' : 'اسألي عن السعر 💬';

document.getElementById('prev_img').src=img;
document.getElementById('prev_name').innerText=name;
document.getElementById('prev_price').innerText=priceJOD;
document.getElementById('preview').style.display='block';

const product={id:Date.now(),cat:cat,name:name,price:priceJOD,img:img,link:aff};
store.products.unshift(product);
save();
status.innerText='✅ تمت الإضافة في خانة '+cat+' - الصورة والمعلومات والسعر الأردني جاهزين!';
document.getElementById('aff_link').value='';

}catch(e){
status.innerText='⚠️ الرابط أفلييت مختصر - للضمان: افتحي المنتج في شي إن وانسخي رابط الصورة والاسم يدوياً، أو جربي رابط المنتج العادي مش الأفلييت';
const fallback={id:Date.now(),cat:cat,name:'منتج شي إن - افتحي الرابط',price:'--',img:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500',link:aff};
store.products.unshift(fallback);
save();
}
}
function delProduct(id){if(confirm('حذف المنتج؟')){store.products=store.products.filter(p=>p.id!==id);save();}}
render();
</script>
</body>
</html>
